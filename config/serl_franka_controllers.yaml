/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000
      thread_priority: 98

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

      joint_position_controller:
        type: serl_franka_controllers/JointPositionController

      joint_position_oscillation_controller:
        type: serl_franka_controllers/JointPositionOscillationController

      cartesian_impedance_controller:
        type: serl_franka_controllers/CartesianImpedanceController

      force_slide_controller:
        type: serl_franka_controllers/ForceSlideController

      joint_force_slide_controller:
        type: serl_franka_controllers/JointForceSlideController

/**:
  franka_robot_state_broadcaster:
    ros__parameters:
      arm_id: "fr3"
      lock_try_count: 5
      lock_sleep_interval: 5
      lock_log_error: true
      lock_update_success: false

/**:
  joint_state_broadcaster:
    ros__parameters:
      joints:
        - fr3_joint1
        - fr3_joint2
        - fr3_joint3
        - fr3_joint4
        - fr3_joint5
        - fr3_joint6
        - fr3_joint7

/**:
  joint_position_controller:
    ros__parameters:
      arm_id: "fr3"
      target_joint_positions: [0.0, -0.785, 0.0, -2.356, 0.0, 1.571, 0.785]
      # ready 位置 使用弧度表示
      # target_joint_positions: [0.0, 0.168, 0.557, -2.193, -1.1723, 1.186, 0.110]
      # STA 任务的标准位置
      k_gains: [600.0, 600.0, 600.0, 600.0, 250.0, 150.0, 50.0]
      d_gains: [50.0, 50.0, 50.0, 50.0, 30.0, 25.0, 15.0]

/**:
  joint_position_oscillation_controller:
    ros__parameters:
      arm_id: "fr3"
      motion_duration: 10.0
      start_phase: "joint_move"
      target_joint_positions_a: [0.0, -0.785, 0.0, -2.356, 0.0, 1.571, 0.785]
      target_joint_positions_b: [0.0, 0.168, 0.557, -2.193, -1.1723, 1.186, 0.110]
      k_gains: [600.0, 600.0, 600.0, 600.0, 250.0, 150.0, 50.0]
      d_gains: [50.0, 50.0, 50.0, 50.0, 30.0, 25.0, 15.0]

/**:
  cartesian_impedance_controller:
    ros__parameters:
      arm_id: "fr3"

/**:
  joint_force_slide_controller:
    ros__parameters:
      arm_id: "fr3"
      target_joint_positions: [0.0, 0.168, 0.557, -2.193, -1.1723, 1.186, 0.110]
      k_gains: [600.0, 600.0, 600.0, 600.0, 250.0, 150.0, 50.0]
      d_gains: [50.0, 50.0, 50.0, 50.0, 30.0, 25.0, 15.0]
      motion_duration: 10.0
      start_phase: "joint_move"
      target_force: 1.0
      slide_distance: 0.1
      descend_speed: 0.005
      slide_speed: 0.01
      force_kp: 0.005
      force_ki: 0.01
      force_filter_alpha: 0.1
      max_descend_distance: 0.15
      translational_stiffness_xy: 2000.0
      translational_stiffness_z_settle: 2000.0
      translational_stiffness_z_descend: 1500.0
      translational_stiffness_z_slide: 200.0
      rotational_stiffness: 150.0
      translational_damping_xy: 89.0
      translational_damping_z_settle: 89.0
      translational_damping_z_descend: 60.0
      translational_damping_z_slide: 30.0
      rotational_damping: 7.0
      nullspace_stiffness: 20.0
      joint1_nullspace_stiffness: 20.0
      max_joint_velocity: 2.0       # rad/s - 关节速度上限
      max_cartesian_velocity: 0.5   # m/s - 末端线速度上限
      max_torque: 30.0              # Nm - 关节力矩上限

/**:
  force_slide_controller:
    ros__parameters:
      arm_id: "fr3"
      target_force: 1.0
      slide_distance: 0.1
      descend_speed: 0.05
      slide_speed: 0.01
      force_kp: 0.001
      force_ki: 0.0001
      force_filter_alpha: 0.1
      max_descend_distance: 0.15
      translational_stiffness_xy: 2000.0
      translational_stiffness_z: 200.0
      rotational_stiffness: 150.0
      translational_damping_xy: 89.0
      translational_damping_z: 30.0
      rotational_damping: 7.0
      nullspace_stiffness: 20.0
      joint1_nullspace_stiffness: 20.0
